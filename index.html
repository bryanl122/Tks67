<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Container Park Simulator — Parc à Conteneurs</title>
  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2316a34a'/%3E%3Cpath d='M20 24h24v18a4 4 0 0 1-4 4H24a4 4 0 0 1-4-4z' fill='%23064e3b'/%3E%3Crect x='18' y='20' width='28' height='6' rx='2' fill='%23bbf7d0'/%3E%3C/svg%3E" />
  <!-- Three.js vendorisé localement (aucune connexion internet requise). -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="loading" class="loading-screen">
    <div class="logo-big">♻ ÉCOPARC</div>
    <div class="logo-sub">CONTAINER PARK SIMULATOR</div>
    <div class="loading-bar"><div class="loading-fill"></div></div>
    <div class="loading-tip" id="loading-tip">Chargement du parc…</div>
  </div>

  <canvas id="scene"></canvas>

  <!-- Couche d'ambiance (météo, jour/nuit) -->
  <div id="weather-overlay"></div>
  <div id="night-overlay"></div>

  <!-- HUD principal -->
  <header id="hud-top" class="hidden">
    <div class="hud-brand">♻ <span id="park-name">ÉcoParc Wallonie</span></div>
    <div class="hud-stats">
      <div class="stat" title="Trésorerie"><span class="stat-ico">💶</span><span id="stat-cash">0</span> €</div>
      <div class="stat" title="EcoGems (premium)"><span class="stat-ico">💎</span><span id="stat-gems">0</span></div>
      <div class="stat" title="Réputation"><span class="stat-ico">⭐</span><span id="stat-rep">50</span>%</div>
      <div class="stat" title="Niveau"><span class="stat-ico">🏅</span>Niv. <span id="stat-level">1</span></div>
      <div class="stat" title="Tonnes recyclées"><span class="stat-ico">♻</span><span id="stat-tons">0</span> t</div>
    </div>
    <div class="hud-time">
      <div class="clock"><span id="stat-day">Jour 1</span> · <span id="stat-clock">08:00</span></div>
      <div class="weather" id="stat-weather">☀ Ensoleillé</div>
      <div class="speed-controls">
        <button data-speed="0" title="Pause">❚❚</button>
        <button data-speed="1" class="active" title="Normal">▶</button>
        <button data-speed="2" title="Rapide">▶▶</button>
        <button data-speed="4" title="Très rapide">▶▶▶</button>
      </div>
    </div>
  </header>

  <!-- Barre d'outils latérale -->
  <nav id="toolbar" class="hidden">
    <button data-panel="dashboard" class="tool active" title="Tableau de bord">📊</button>
    <button data-panel="build" class="tool" title="Construction">🏗</button>
    <button data-panel="staff" class="tool" title="Personnel">👷</button>
    <button data-panel="research" class="tool" title="Recherche">🔬</button>
    <button data-panel="economy" class="tool" title="Économie">💰</button>
    <button data-panel="stats" class="tool" title="Statistiques">📈</button>
    <button data-panel="shop" class="tool tool-shop" title="Boutique premium">🛒</button>
    <button data-panel="achievements" class="tool" title="Succès">🏆</button>
    <button data-panel="settings" class="tool" title="Paramètres">⚙</button>
  </nav>

  <!-- Conteneur des panneaux -->
  <aside id="panel" class="hidden"></aside>

  <!-- Journal de notifications -->
  <div id="toasts"></div>

  <!-- Infobulle d'objet sélectionné -->
  <div id="inspector" class="hidden"></div>

  <script type="module" src="./src/game.js"></script>
</body>
</html>
