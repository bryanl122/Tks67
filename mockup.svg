<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7e5f"/><stop offset="1" stop-color="#feb47b"/>
    </linearGradient>
    <clipPath id="r"><rect width="390" height="844" rx="40"/></clipPath>
  </defs>

  <g clip-path="url(#r)">
    <rect width="390" height="844" fill="#000"/>

    <!-- status bar -->
    <text x="24" y="36" fill="#fff" font-size="15" font-weight="600">15:46</text>
    <text x="320" y="36" fill="#fff" font-size="13">5G ▮</text>

    <!-- top bar -->
    <circle cx="40" cy="74" r="19" fill="#1c1c1e"/>
    <text x="40" y="80" fill="#fff" font-size="16" text-anchor="middle">☰</text>
    <rect x="108" y="58" width="174" height="34" rx="17" fill="#1c1c1e"/>
    <rect x="112" y="62" width="166" height="26" rx="13" fill="#3a3a3c"/>
    <text x="195" y="80" fill="#fff" font-size="13.5" text-anchor="middle">Modifier une image</text>
    <circle cx="350" cy="74" r="19" fill="#1c1c1e"/>
    <text x="350" y="80" fill="#fff" font-size="15" text-anchor="middle">⟳</text>

    <!-- stage: result image preview -->
    <rect x="35" y="150" width="320" height="320" rx="16" fill="url(#sky)"/>
    <circle cx="300" cy="220" r="26" fill="#fff3c4" opacity="0.95"/>
    <path d="M35 470 L130 380 L210 440 L280 390 L355 470 Z" fill="#3a2a4a" opacity="0.85"/>
    <text x="40" y="498" fill="#4f86ff" font-size="14" font-weight="600">⬇ Télécharger</text>

    <!-- bottom dock -->
    <!-- action pill -->
    <rect x="20" y="640" width="350" height="48" rx="16" fill="#121212" stroke="#2a2a2c"/>
    <text x="195" y="670" fill="#fff" font-size="14" text-anchor="middle">📷  photo-montagne.jpg</text>

    <!-- composer -->
    <rect x="20" y="700" width="350" height="52" rx="26" fill="#121212" stroke="#2a2a2c"/>
    <circle cx="48" cy="726" r="16" fill="#1c1c1e"/>
    <text x="48" y="732" fill="#fff" font-size="20" text-anchor="middle">+</text>
    <text x="76" y="731" fill="#fff" font-size="15">rends le ciel orange…</text>
    <circle cx="346" cy="726" r="19" fill="#2f6bff"/>
    <text x="346" y="732" fill="#fff" font-size="18" text-anchor="middle">↑</text>

    <!-- home indicator -->
    <rect x="135" y="822" width="120" height="5" rx="2.5" fill="#3a3a3c"/>
  </g>
</svg>
