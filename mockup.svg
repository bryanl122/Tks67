<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c5ce7"/>
      <stop offset="1" stop-color="#8b7cf6"/>
    </linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b5876"/>
      <stop offset="1" stop-color="#4e4376"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7e5f"/>
      <stop offset="1" stop-color="#feb47b"/>
    </linearGradient>
    <clipPath id="round"><rect x="0" y="0" width="390" height="844" rx="40"/></clipPath>
  </defs>

  <!-- phone body -->
  <g clip-path="url(#round)">
    <rect width="390" height="844" fill="#0f1117"/>

    <!-- status bar -->
    <text x="24" y="34" fill="#e7e9f0" font-size="14" font-weight="600">9:41</text>
    <text x="332" y="34" fill="#e7e9f0" font-size="13">📶 🔋</text>

    <!-- title -->
    <text x="20" y="74" fill="#e7e9f0" font-size="22" font-weight="700">🎨 Éditeur photo IA</text>
    <text x="20" y="96" fill="#9aa0b4" font-size="12">Uploade une photo, décris la modif, l'IA la réalise.</text>

    <!-- card 1: photo -->
    <rect x="16" y="112" width="358" height="232" rx="16" fill="#1a1d28" stroke="#2a2e3d"/>
    <text x="32" y="136" fill="#9aa0b4" font-size="11">1. Ta photo</text>
    <rect x="32" y="148" width="326" height="180" rx="12" fill="url(#photo)"/>
    <!-- a little mountain/sun motif -->
    <circle cx="300" cy="200" r="22" fill="#ffd27d" opacity="0.9"/>
    <path d="M32 300 L120 230 L190 285 L250 240 L358 300 Z" fill="#1f2a3a" opacity="0.8"/>
    <text x="195" y="322" fill="#cfd3e0" font-size="11" text-anchor="middle">photo-montagne.jpg</text>

    <!-- card 2: instruction -->
    <rect x="16" y="356" width="358" height="196" rx="16" fill="#1a1d28" stroke="#2a2e3d"/>
    <text x="32" y="380" fill="#9aa0b4" font-size="11">2. La modification souhaitée</text>
    <rect x="32" y="392" width="326" height="56" rx="10" fill="#11131c" stroke="#2a2e3d"/>
    <text x="44" y="424" fill="#e7e9f0" font-size="13">rends le ciel orange au coucher de soleil</text>

    <!-- chips -->
    <g font-size="10.5">
      <rect x="32" y="462" width="150" height="26" rx="13" fill="#11131c" stroke="#2a2e3d"/>
      <text x="42" y="479" fill="#9aa0b4">transforme en peinture à l'huile</text>
      <rect x="190" y="462" width="120" height="26" rx="13" fill="#11131c" stroke="#2a2e3d"/>
      <text x="200" y="479" fill="#9aa0b4">ambiance hiver enneigé</text>
      <rect x="32" y="496" width="96" height="26" rx="13" fill="#11131c" stroke="#2a2e3d"/>
      <text x="42" y="513" fill="#9aa0b4">style aquarelle</text>
      <rect x="136" y="496" width="112" height="26" rx="13" fill="#11131c" stroke="#2a2e3d"/>
      <text x="146" y="513" fill="#9aa0b4">rends-le nocturne</text>
    </g>
    <text x="32" y="540" fill="#9aa0b4" font-size="11">▸ Réglages avancés</text>

    <!-- big button -->
    <rect x="16" y="564" width="358" height="50" rx="12" fill="url(#accent)"/>
    <text x="195" y="595" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Modifier l'image ✨</text>

    <!-- result card -->
    <rect x="16" y="628" width="358" height="120" rx="16" fill="#1a1d28" stroke="#2a2e3d"/>
    <text x="32" y="652" fill="#9aa0b4" font-size="11">Résultat</text>
    <rect x="32" y="662" width="120" height="74" rx="10" fill="url(#sky)"/>
    <circle cx="120" cy="690" r="14" fill="#fff3c4" opacity="0.95"/>
    <path d="M32 736 L70 706 L100 728 L130 704 L152 736 Z" fill="#3a2a4a" opacity="0.85"/>
    <text x="172" y="690" fill="#8b7cf6" font-size="12" font-weight="600">⬇ Télécharger</text>
    <text x="172" y="712" fill="#5fd38a" font-size="11">✓ ciel orange appliqué</text>

    <!-- history -->
    <rect x="16" y="760" width="358" height="74" rx="16" fill="#1a1d28" stroke="#2a2e3d"/>
    <text x="32" y="784" fill="#9aa0b4" font-size="11">Historique</text>
    <text x="326" y="784" fill="#9aa0b4" font-size="10">Vider</text>
    <rect x="32" y="794" width="40" height="32" rx="7" fill="url(#sky)"/>
    <rect x="80" y="794" width="40" height="32" rx="7" fill="#3a6f52"/>
    <rect x="128" y="794" width="40" height="32" rx="7" fill="#5a4a72"/>
    <rect x="176" y="794" width="40" height="32" rx="7" fill="#244a66"/>
  </g>
</svg>
